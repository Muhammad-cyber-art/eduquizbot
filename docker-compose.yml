version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eduquiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduquiz_pass}
      POSTGRES_DB: ${POSTGRES_DB:-eduquiz}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    depends_on:
      - db
    env_file:
      - eduquiz_bot/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-eduquiz}:${POSTGRES_PASSWORD:-eduquiz_pass}@db:5432/${POSTGRES_DB:-eduquiz}
    ports:
      - "8000:8000"
    volumes:
      - ./eduquiz_bot/data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
