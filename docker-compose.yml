# EduQuiz Bot — Production Docker Compose
#
# Prerequisites: copy .env.example → .env and fill in all required values.
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f backend
#   docker compose ps

services:

  # ── PostgreSQL ────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-eduquiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB:       ${POSTGRES_DB:-eduquiz}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Do NOT expose port 5432 to the host — only reachable inside the Docker network
    expose:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER:-eduquiz} -d ${POSTGRES_DB:-eduquiz}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Resource limits: prevent a runaway query from killing the VPS
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # REDIS_PASSWORD is required — no insecure default
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    expose:
      - "6379"
    healthcheck:
      test:
        - "CMD"
        - "redis-cli"
        - "-a"
        - "${REDIS_PASSWORD}"
        - "ping"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 192m
          cpus: "0.25"

  # ── Backend WEB (FastAPI + Admin) ─────────────────────────
  backend-web:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - eduquiz_bot/.env
    environment:
      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-eduquiz}:${POSTGRES_PASSWORD:?Required}@db:5432/${POSTGRES_DB:-eduquiz}
      REDIS_URL: >-
        redis://:${REDIS_PASSWORD:?Required}@redis:6379/0
      APP_ENV: production
      PROCESS_ROLE: web
    expose:
      - "8001"
    volumes:
      - ./eduquiz_bot/data:/app/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/api/health', timeout=5).status == 200 else 1)\""
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ── Backend BOT (Aiogram Polling) ─────────────────────────
  backend-bot:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - eduquiz_bot/.env
    environment:
      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-eduquiz}:${POSTGRES_PASSWORD:?Required}@db:5432/${POSTGRES_DB:-eduquiz}
      REDIS_URL: >-
        redis://:${REDIS_PASSWORD:?Required}@redis:6379/0
      APP_ENV: production
      PROCESS_ROLE: bot
    volumes:
      - ./eduquiz_bot/data:/app/data
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ── Frontend (Nginx SPA + Proxy) ──────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      # Port 80 is exposed to the host.
      # On production VPS with HTTPS, put a Certbot-managed Nginx in front of this,
      # or add a separate Nginx service that handles TLS termination.
      - "80:80"
    depends_on:
      backend-web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

volumes:
  postgres_data:
    driver: local
