services:
  # ── Backend & Telegram Bot ────────────────────────────────
  - type: web
    name: eduquiz-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./eduquiz.db
      - key: LANG_DEFAULT
        value: uz
      - key: LOG_LEVEL
        value: INFO

  # ── React Frontend Website (Free Static Site) ────────────
  - type: web
    name: eduquiz-website
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
