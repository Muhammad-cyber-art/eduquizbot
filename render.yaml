services:
  - type: web
    name: eduquiz-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./eduquiz.db
      - key: LANG_DEFAULT
        value: uz
      - key: LOG_LEVEL
        value: INFO
