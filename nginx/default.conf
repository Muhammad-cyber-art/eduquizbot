# Nginx configuration for EduQuiz Bot
# Serves the React SPA and proxies /api/* to the FastAPI backend.
#
# Security hardening:
#   - Server tokens hidden
#   - Security headers applied to all responses
#   - Hidden files (.) blocked
#   - Gzip enabled for static assets
#   - index.html not cached (SPA routing)
#   - Static assets cached aggressively (content-hashed by Vite)

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Hide Nginx version from error pages and Server header
    server_tokens off;

    # ── Gzip compression ──────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── Security headers ──────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"                        always;
    add_header X-Frame-Options           "SAMEORIGIN"                     always;
    add_header X-XSS-Protection          "1; mode=block"                  always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy
        "default-src 'self';
         script-src 'self' 'unsafe-inline' https://telegram.org;
         style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
         font-src 'self' https://fonts.gstatic.com;
         img-src 'self' data: https:;
         connect-src 'self' https://api.telegram.org wss://*;
         frame-ancestors 'self' https://web.telegram.org https://oauth.telegram.org;"
        always;

    # ── Block hidden files (e.g. .env, .git) ─────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── API proxy → FastAPI backend-web ─────────────────────────
    location /api/ {
        proxy_pass         http://backend-web:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeout tuning: AI generate endpoint can take up to 45 seconds
        proxy_read_timeout    90s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;

        # Buffer settings for large responses
        proxy_buffer_size         16k;
        proxy_buffers             4 32k;
        proxy_busy_buffers_size   64k;
    }

    # ── index.html — no cache (SPA routing must always load latest) ──
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # ── Vite-hashed static assets — immutable long-term cache ────────
    location ~* \.(js|css|woff2?|ico|png|jpg|jpeg|svg|gif|webp)$ {
        root    /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA catch-all — all other paths serve index.html ─────────────
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;
    }
}
