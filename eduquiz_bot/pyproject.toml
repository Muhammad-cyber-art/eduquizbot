[project]
name = "eduquiz-bot"
version = "0.2.0"
description = "EduQuiz — SaaS Telegram Bot + Web Dashboard for quiz platforms"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.1,<3",
    "python-docx>=1.1,<2",
    "PyPDF2>=3.0,<4",
    "redis>=5.0,<6",
    "pyyaml>=6.0,<7",
    "openpyxl>=3.1,<4",
    "aiohttp-socks>=0.9,<1",
    "PyMuPDF>=1.24,<2",
    "Pillow>=10.0,<11",
    # Web dashboard
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]
docx-pdf = [
    "docx2pdf>=0.1,<1",
]

[tool.ruff]
line-length = 99
target-version = "py311"
