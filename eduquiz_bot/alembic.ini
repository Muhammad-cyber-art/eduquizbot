# EduQuiz Bot — Alembic Configuration
# https://alembic.sqlalchemy.org/en/latest/tutorial.html
#
# Usage:
#   cd eduquiz_bot
#   alembic revision --autogenerate -m "describe_your_change"
#   alembic upgrade head
#
# The DATABASE_URL is read from the DATABASE_URL environment variable
# (overrides the sqlalchemy.url value below). This allows the same
# alembic.ini to work in both development (SQLite) and production (PostgreSQL).

[alembic]
script_location = migrations
version_locations = migrations/versions
prepend_sys_path = .
version_path_separator = os
# Default URL — overridden by DATABASE_URL env var in migrations/env.py
# MUST be postgresql+asyncpg:// in production
sqlalchemy.url = postgresql+asyncpg://eduquiz:eduquiz_pass@localhost:5432/eduquiz

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
